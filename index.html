<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0712"><title>CardVault</title>
<style>
body{margin:0;background:#09070d;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:700px;margin:auto;padding:18px 16px 100px}.brand{font-size:30px;font-weight:800;margin:8px 0 18px}.brand b{color:#9b5cff}.box{background:#17111f;border:1px solid #30243b;border-radius:18px;padding:18px;margin:12px 0}.value{font-size:34px;font-weight:800}.muted{color:#aaa1b5}.btn{width:100%;padding:16px;border:0;border-radius:15px;background:#9b5cff;color:#fff;font-weight:800;font-size:17px;margin-top:10px}.secondary{background:#251a30}.nav{position:fixed;bottom:0;left:0;right:0;background:#120d17;border-top:1px solid #30243b;display:flex}.nav button{flex:1;padding:13px 3px;background:none;color:#aaa1b5;border:0}.nav button.active{color:white}.view{display:none}.view.active{display:block}.card{display:flex;align-items:center;gap:12px;background:#17111f;border:1px solid #30243b;border-radius:15px;padding:10px;margin:9px 0}.card img{width:54px;height:76px;object-fit:cover;border-radius:6px}.meta{flex:1}.price{font-weight:800}.search{width:100%;padding:14px;border-radius:13px;border:1px solid #30243b;background:#100c15;color:white;font-size:16px;box-sizing:border-box}.empty{text-align:center;color:#aaa1b5;padding:35px}.hero{text-align:center;padding:25px 8px}.hero .icon{font-size:70px;color:#9b5cff}dialog{background:#120d17;color:white;border:1px solid #30243b;border-radius:18px;width:92%;padding:0}dialog::backdrop{background:#000b}video{width:100%;height:55vh;object-fit:cover}.cam{padding:14px;text-align:center}.small{font-size:13px;color:#aaa1b5}
</style></head><body><div class="app"><div class="brand">Card<b>Vault</b></div>
<div class="box"><div class="muted">Total Collection Value</div><div class="value" id="total">$0.00</div><div class="small" id="count">0 cards</div></div>
<section id="scan" class="view active"><div class="hero"><div class="icon">⌾</div><h1>Scan a Magic Card</h1><p class="muted">Use your iPhone camera, enter the card name if needed, then CardVault looks it up and shows its Scryfall USD price.</p><button class="btn" onclick="openCam()">📸 Open Camera</button></div><div id="match"></div></section>
<section id="collection" class="view"><h2>My Collection</h2><input class="search" placeholder="Search your cards" oninput="render(this.value)"><div id="list"></div></section>
<section id="decks" class="view"><h2>Deck Builder</h2><p class="muted">Starter builder uses cards you own and limits copies to four per card.</p><button class="btn" onclick="buildDeck()">✨ Build Deck From My Collection</button><div id="deck"></div></section>
<section id="search" class="view"><h2>Search Cards</h2><input id="q" class="search" placeholder="Card name" oninput="lookupSearch()"><div id="result"></div></section></div>
<div class="nav"><button class="active" onclick="tab('scan',this)">📷<br>Scan</button><button onclick="tab('collection',this)">📚<br>Collection</button><button onclick="tab('decks',this)">🧙<br>Decks</button><button onclick="tab('search',this)">🔎<br>Search</button></div>
<dialog id="dlg"><video id="video" autoplay playsinline></video><div class="cam"><button class="btn" onclick="photo()">Take Photo</button><button class="btn secondary" onclick="closeCam()">Close</button><p id="status" class="small"></p></div><canvas id="canvas" hidden></canvas></dialog>
<script>
const K='cardvault';let cards=JSON.parse(localStorage.getItem(K)||'[]'),stream;
const $=x=>document.getElementById(x);
function save(){localStorage.setItem(K,JSON.stringify(cards));totals();render()}
function totals(){let v=cards.reduce((s,c)=>s+(c.price||0)*c.qty,0),n=cards.reduce((s,c)=>s+c.qty,0);$('total').textContent=v.toLocaleString('en-US',{style:'currency',currency:'USD'});$('count').textContent=n+' card'+(n==1?'':'s')}
function tab(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='collection')render();if(id==='decks')renderDeck()}
async function openCam(){if(!navigator.mediaDevices?.getUserMedia){return alert('Camera is not available in this browser. Open CardVault in Safari over HTTPS.')}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('status').textContent='Center the card and tap Take Photo.';$('dlg').showModal()}catch(e){alert('Please allow camera access for CardVault in Safari.')}} 
function closeCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('dlg').close()}
async function photo(){let v=$('video'),c=$('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let name=prompt('Enter the card name so CardVault can identify it:', '');if(name)lookup(name)}
async function lookup(name){$('status').textContent='Looking up '+name+'…';try{let r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(name));if(!r.ok)throw 0;let c=await r.json();show(c);closeCam()}catch(e){$('status').textContent='Card not found. Try the exact name.'}}
function show(c){let x={id:c.id,name:c.name,set:c.set_name,price:c.prices?.usd?+c.prices.usd:0,img:c.image_uris?.normal||'',qty:1};$('match').innerHTML='<div class="card"><img src="'+x.img+'"><div class="meta"><b>'+esc(x.name)+'</b><div class="small">'+esc(x.set)+'</div></div><div class="price">'+money(x.price)+'</div><button onclick=addCard() >Add</button></div>';window.pending=x}
function addCard(){let x=window.pending,old=cards.find(c=>c.id===x.id);old?old.qty++:cards.push(x);save();$('match').innerHTML='<div class="box">✅ Added to your collection.</div>'}
function render(f=''){let a=cards.filter(c=>c.name.toLowerCase().includes(f.toLowerCase()));$('list').innerHTML=a.length?a.map(c=>'<div class="card"><img src="'+c.img+'"><div class="meta"><b>'+esc(c.name)+'</b><div class="small">'+esc(c.set)+' • ×'+c.qty+'</div></div><div class="price">'+money(c.price)+'</div></div>').join(''):'<div class="empty">Your collection is empty. Scan a card to start.</div>'}
function buildDeck(){let d=[];cards.forEach(c=>{for(let i=0;i<Math.min(4,c.qty)&&d.length<60;i++)d.push(c)});$('deck').innerHTML=d.length?'<div class="box"><b>Starter deck: '+d.length+' cards</b></div>'+d.map(c=>'<div class="card"><div class="meta">'+esc(c.name)+'</div></div>').join(''):'<div class="empty">Add cards first.</div>'}
function renderDeck(){if(cards.length)buildDeck();else $('deck').innerHTML='<div class="empty">Add cards first.</div>'}
let timer;async function lookupSearch(){clearTimeout(timer);timer=setTimeout(async()=>{let q=$('q').value.trim();if(q.length<3){$('result').innerHTML='';return}try{let r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(q));if(!r.ok)throw 0;let c=await r.json();$('result').innerHTML='<div class="card"><img src="'+(c.image_uris?.normal||'')+'"><div class="meta"><b>'+esc(c.name)+'</b><div class="small">'+esc(c.set_name)+'</div></div><div class="price">'+money(c.prices?.usd?+c.prices.usd:0)+'</div></div>'}catch{$('result').innerHTML='<div class="empty">No card found.</div>'}},400)}
function money(n){return (+n||0).toLocaleString('en-US',{style:'currency',currency:'USD'})}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
totals();render();
</script></body></html>
