<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardVault</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:700px;margin:auto;padding:18px 16px 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{margin:0;font-size:30px}.muted,.small{color:#9ca3af}.card{background:#151922;border:1px solid #2b3240;border-radius:18px;padding:18px;margin-top:14px}button{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:700;color:#fff;background:#2563eb;cursor:pointer}.secondary{background:#252b36}.full{width:100%;margin-top:12px}.nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}.nav button{white-space:nowrap;flex:0 0 auto}video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;border-radius:16px}.hidden{display:none}.status{padding:13px 14px;border-radius:12px;background:#202632;margin-top:12px;line-height:1.4}.choices{display:grid;gap:10px;margin-top:14px}.choice{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:#202632}.choice img{width:58px;border-radius:6px}.meta{flex:1}.price{color:#86efac;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;padding:12px;border-radius:12px;border:1px solid #3a4352;background:#0f131b;color:#fff;font-size:16px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><div class="top"><h1>CardVault</h1><span class="muted">Magic Card Scanner</span></div><div class="nav"><button id="scanTab">📷 Scan Card</button><button id="collectionTab">🗃️ Collection</button><button id="sharedTab">🌐 Shared Decks</button><button id="builderTab">🃏 Deck Builder</button><button id="savedTab">📚 Saved Decks</button></div><section id="scanner" class="card"><h2>Scan a card</h2><p class="muted">Hold one Magic card in view, then scan it.</p><video id="video" autoplay playsinline muted></video><button id="start" class="full">Start Camera</button><button id="capture" class="full secondary hidden">📸 Scan This Card</button><div id="status" class="status">Tap Start Camera to begin.</div><canvas id="canvas" class="hidden"></canvas></section><section id="result" class="card hidden"><h2>Card Found</h2><div id="resultBody"></div><button id="again" class="full secondary">Scan Another Card</button></section><section id="collection" class="card hidden"><h2>My Collection</h2><div id="cards"></div></section><section id="builder" class="card hidden"><h2>🃏 Deck Builder</h2><input id="deckName" placeholder="Deck name"><div id="builderList"></div><div class="grid"><button id="newDeck" class="secondary">New Deck</button><button id="saveDeck">Save Deck</button></div><div id="deckStatus" class="status"></div></section><section id="saved" class="card hidden"><h2>📚 Saved Decks</h2><div id="savedList"></div></section><section id="shared" class="card hidden"><h2>🌐 Shared Decks</h2><div id="sharedList"><div class="status">Loading shared decks...</div></div></section></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),sections=["scanner","result","collection","builder","saved","shared"],KEY="cardvault_cards",DKEY="cardvault_decks";let stream=null,currentDeck={};const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const cards=()=>JSON.parse(localStorage.getItem(KEY)||"[]"),decks=()=>JSON.parse(localStorage.getItem(DKEY)||"[]");function show(id){sections.forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="collection")renderCollection();if(id==="builder")renderBuilder();if(id==="saved")renderSaved();if(id==="shared")loadShared()}
$("scanTab").onclick=()=>show("scanner");$("collectionTab").onclick=()=>show("collection");$("builderTab").onclick=()=>show("builder");$("savedTab").onclick=()=>show("saved");$("sharedTab").onclick=()=>show("shared");
$("start").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("video").srcObject=stream;$("capture").classList.remove("hidden");$("start").textContent="Camera On";$("status").textContent="Camera on. Tap Scan This Card."}catch(e){$("status").textContent="Camera access was blocked. Allow Camera and reload the page."}};
$("capture").onclick=async()=>{if(!stream)return;const v=$("video"),c=$("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);$("status").textContent="Reading card…";try{const r=await Tesseract.recognize(c,"eng");const lines=r.data.text.split(/\n+/).map(x=>x.trim()).filter(Boolean);const name=lines[0];if(!name)throw 0;const res=await fetch("https://api.scryfall.com/cards/named?fuzzy="+encodeURIComponent(name));if(!res.ok)throw 0;showCard(await res.json())}catch(e){$("status").textContent="I could not identify that card. Move closer, use bright light, and try again."}};
function showCard(c){show("result");const img=c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||"",p=c.prices?.usd?"$"+c.prices.usd:"Price unavailable";$("resultBody").innerHTML='<div style="display:flex;gap:14px">'+(img?'<img src="'+img+'" style="width:105px;border-radius:10px">':"")+'<div><div style="font-size:21px;font-weight:800">'+esc(c.name)+'</div><div class="small">'+esc(c.set_name||"")+' • #'+esc(c.collector_number||"?")+'</div><div class="price">'+p+'</div></div></div><button id="add" class="full">➕ Add to Collection</button>';$('add').onclick=()=>{const a=cards();a.unshift({id:c.id,name:c.name,set:c.set_name,collector:c.collector_number,price:c.prices?.usd||null});localStorage.setItem(KEY,JSON.stringify(a));$('add').textContent="✓ Added to Collection";$('add').disabled=true}};
$("again").onclick=()=>show("scanner");
function renderCollection(){const a=cards();if(!a.length){$("cards").innerHTML='<div class="status">No cards scanned yet.</div>';return}const m={};a.forEach(c=>{const k=c.id||c.name;m[k]??={...c,qty:0};m[k].qty++});$("cards").innerHTML=Object.values(m).map(x=>'<div class="card"><b>'+esc(x.name)+'</b><div class="small">'+esc(x.set||"")+'</div><div class="price">$'+(Number(x.price)||0).toFixed(2)+' each • '+x.qty+' owned</div></div>').join("")}
function key(c){return c.id||c.name}function renderBuilder(){const a=cards();if(!a.length){$("builderList").innerHTML='<div class="status">No cards in your collection yet.</div>';return}$("builderList").innerHTML=a.map((c,i)=>'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>'+esc(c.name)+'</b><div class="small">'+esc(c.collector||"")+'</div></div><div><button class="secondary" data-m="'+i+'">−</button> <b>'+Number(currentDeck[key(c)]||0)+'</b> <button data-p="'+i+'">+</button></div></div></div>').join("");$("builderList").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const c=a[+b.dataset.m];currentDeck[key(c)]=Math.max(0,Number(currentDeck[key(c)]||0)-1);renderBuilder()});$("builderList").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const c=a[+b.dataset.p];currentDeck[key(c)]=Number(currentDeck[key(c)]||0)+1;renderBuilder()})}
$("newDeck").onclick=()=>{currentDeck={};$("deckName").value="";$("deckStatus").textContent="New deck started.";renderBuilder()};$("saveDeck").onclick=()=>{const name=$("deckName").value.trim();if(!name){$("deckStatus").textContent="Please enter a deck name.";return}const out=[];cards().forEach(c=>{const q=Number(currentDeck[key(c)]||0);if(q)out.push({id:c.id,name:c.name,collectorNumber:c.collector||"",quantity:q})});const d=decks();d.push({id:Date.now().toString(),name,cards:out,createdAt:new Date().toISOString()});localStorage.setItem(DKEY,JSON.stringify(d));$("deckStatus").textContent='Saved "'+name+'" with '+out.reduce((n,c)=>n+c.quantity,0)+' cards.'};
function renderSaved(){const d=decks();$("savedList").innerHTML=d.length?d.map(x=>'<div class="card"><h3>🃏 '+esc(x.name)+'</h3><div class="small">'+(x.cards||[]).reduce((n,c)=>n+Number(c.quantity||0),0)+' cards</div>'+((x.cards||[]).map(c=>'<div style="padding:5px 0">'+esc(c.name)+' × '+c.quantity+'</div>').join(""))+'</div>').join(""): '<div class="status">No saved decks yet.</div>'}
async function loadShared(){const box=$("sharedList");box.innerHTML='<div class="status">Loading shared decks...</div>';try{const sb=window.supabase.createClient("https://mngrhjkwbedsnipzfhlv.supabase.co","sb_publishable_cVi6iGhLNcSMAi2OlmsIsQ_RNluD7uT");const {data,error}=await sb.from("shared_decks").select("*").order("created_at",{ascending:false});if(error)throw error;if(!data?.length){box.innerHTML='<div class="status">No shared decks yet.</div>';return}box.innerHTML=data.map(d=>'<div class="card"><h3>🌐 '+esc(d.name||"Unnamed Deck")+'</h3><div class="small">By '+esc(d.author||"Anonymous")+'</div><p>'+esc(d.description||"No description")+'</p></div>').join("")}catch(e){box.innerHTML='<div class="status">Could not load shared decks: '+esc(e.message||e)+'</div>'}}
renderCollection();
</script></body></html>
