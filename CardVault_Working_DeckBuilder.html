<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CardVault</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:700px;margin:auto;padding:18px 16px 36px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:30px}.muted{color:#9ca3af}
.card{background:#151922;border:1px solid #2b3240;border-radius:18px;padding:18px;margin-top:14px}
button{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:700;color:#fff;background:#2563eb}
.secondary{background:#252b36}.full{width:100%;margin-top:12px}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:3/4;object-fit:cover}
.hidden{display:none}.status{padding:13px 14px;border-radius:12px;background:#202632;margin-top:12px;line-height:1.4}
.result{display:flex;gap:14px;align-items:flex-start}.result img{width:105px;border-radius:10px}
.name{font-size:21px;font-weight:800;margin-bottom:5px}.price{font-size:18px;color:#86efac;font-weight:700}
.small{font-size:13px;color:#aab2bf}.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:#202632;border:1px solid #333b49}
.choice img{width:58px;border-radius:6px}.choice .meta{flex:1}
.nav{display:flex;gap:8px;margin-bottom:14px}.nav button{flex:1}
select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #333b49;background:#202632;color:#fff;font-size:16px}
.deck-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #2b3240}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>CardVault</h1><span class="muted">Magic Card Scanner</span></div>

<div class="nav">
<button id="scanTab">📷 Scan Card</button>
<button class="secondary" id="collectionTab">🗃 Collection</button>
<button class="secondary" id="decksTab">🃏 Decks</button>
</div>

<section id="scanner" class="card">
<h2>Scan a card</h2>
<p class="muted">No typing required. Hold one Magic card in view, then scan it.</p>
<video id="video" autoplay playsinline muted></video>
<button id="start" class="full">Start Camera</button>
<button id="capture" class="full secondary hidden">📸 Scan This Card</button>
<div id="status" class="status">Tap Start Camera to begin.</div>
<canvas id="canvas" class="hidden"></canvas>
</section>

<section id="resultCard" class="card hidden">
<h2>Card Found</h2><div id="result"></div>
<button id="again" class="full secondary">Scan Another Card</button>
</section>

<section id="collection" class="card hidden">
<h2>My Collection</h2><div id="cards"></div>
</section>

<section id="decks" class="card hidden">
<h2>🃏 Deck Builder</h2>
<p class="muted">Build a casual 60-card deck using cards you've scanned into your collection.</p>

<div class="card">
<h3 style="margin-top:0">🤖 Build a Deck for Me</h3>
<label class="small">Strategy</label>
<select id="strategy">
<option value="balanced">⚖️ Balanced</option>
<option value="aggro">⚔️ Aggro / Attack</option>
<option value="control">🧙 Control</option>
<option value="creatures">🐉 Creature-heavy</option>
<option value="surprise">🎲 Surprise Me</option>
</select>
<label class="small" style="display:block;margin-top:10px">Colors</label>
<select id="colors">
<option value="any">🌈 Any colors</option>
<option value="W">⚪ White</option><option value="U">🔵 Blue</option>
<option value="B">⚫ Black</option><option value="R">🔴 Red</option>
<option value="G">🟢 Green</option>
<option value="WU">⚪🔵 White/Blue</option><option value="BR">⚫🔴 Black/Red</option>
<option value="RG">🔴🟢 Red/Green</option><option value="BG">⚫🟢 Black/Green</option>
<option value="UR">🔵🔴 Blue/Red</option>
</select>
<input id="deckName" style="margin-top:10px" placeholder="Deck name (optional)">
<button id="buildDeck" class="full">✨ Build My Deck</button>
<div id="buildStatus" class="status hidden"></div>
</div>

<div id="deckList"></div>
<div id="deckEditor"></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),statusEl=document.getElementById('status'),
captureBtn=document.getElementById('capture'),startBtn=document.getElementById('start'),
resultCard=document.getElementById('resultCard'),resultEl=document.getElementById('result'),
collection=document.getElementById('collection'),scanner=document.getElementById('scanner'),decks=document.getElementById('decks');
let stream=null;
const KEY='cardvault_cards',DECK_KEY='cardvault_decks';

function setStatus(t){statusEl.textContent=t}
function cards(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveCards(c){localStorage.setItem(KEY,JSON.stringify(c))}
function getDecks(){try{return JSON.parse(localStorage.getItem(DECK_KEY)||'[]')}catch(e){return[]}}
function saveDecks(d){localStorage.setItem(DECK_KEY,JSON.stringify(d))}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function renderCollection(){
 const c=cards();
 document.getElementById('cards').innerHTML=c.length?c.map(x=>`<div class="card" style="margin:10px 0;padding:12px"><b>${esc(x.name)}</b><div class="small">${esc(x.set||'')} • $${esc(x.price||'0')}</div></div>`).join(''):'<p class="muted">No cards scanned yet.</p>';
}

async function startCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1920}},audio:false});
  video.srcObject=stream;captureBtn.classList.remove('hidden');startBtn.textContent='Camera On';
  setStatus('Camera on. Keep the whole card visible and tap Scan This Card.');
 }catch(e){setStatus('Camera access was blocked. Allow Camera in Safari Settings and reload this page.')}
}
function capture(){if(!stream)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);scanImage(canvas)}

async function scanImage(source){
 setStatus('Reading the card automatically…');captureBtn.disabled=true;
 try{
  const {data}=await Tesseract.recognize(source,'eng',{logger:m=>{if(m.status==='recognizing text')setStatus('Reading card… '+Math.round((m.progress||0)*100)+'%')}});
  const raw=data.text||'',name=extractName(raw),cn=extractCollectorNumber(raw);
  if(!name)throw new Error('No card name');
  setStatus('Found: '+name+' — checking printings…');
  const matches=await findPrintings(name,cn);
  if(!matches.length)throw new Error('Not found');
  showMatches(matches,name,cn);
 }catch(e){setStatus('I could not identify that card. Move closer, use bright light, keep the card flat, and try again.')}
 finally{captureBtn.disabled=false}
}
function extractName(text){
 const lines=text.split(/\n+/).map(x=>x.replace(/[^A-Za-z0-9'’\- ,]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const bad=/^(magic|the gathering|mtg|wizards|legendary|creature|instant|sorcery|artifact|enchantment|planeswalker|basic land|land|token)$/i;
 const candidates=lines.slice(0,10).filter(x=>x.length>=3&&x.length<=45&&!bad.test(x));
 return candidates.sort((a,b)=>score(b)-score(a))[0]||''
}
function score(x){return x.split(' ').length*4+x.length/10-(/mana|flying|trample|deathtouch|when|whenever|target|add|draw|destroy/i.test(x)?20:0)}
function extractCollectorNumber(text){const hits=(text.match(/\b\d{1,4}(?:\s*\/\s*\d{1,4})?\b/g)||[]).map(x=>x.split('/')[0].trim());return hits.find(x=>Number(x)>0&&Number(x)<1000)||''}
async function findPrintings(name,cn){
 try{let r=await fetch('https://api.scryfall.com/cards/search?q='+encodeURIComponent('!'+name)+'&unique=prints&order=released&dir=desc');if(r.ok){let d=await r.json(),arr=d.data||[];if(cn){let exact=arr.filter(c=>String(c.collector_number||'').split('/')[0]===String(cn));if(exact.length)return exact.slice(0,8)}return arr.slice(0,8)}}catch(e){}
 try{let r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(name));if(r.ok)return[await r.json()]}catch(e){}
 return[]
}
function showMatches(matches,name,cn){
 resultCard.classList.remove('hidden');
 resultEl.innerHTML=`<div class="name">${esc(name)}</div><div class="small">${cn?'Collector number detected: '+esc(cn)+'. ':''}Choose the matching printing:</div><div class="choices">${matches.map((c,i)=>{let img=c.image_uris?.small||c.card_faces?.[0]?.image_uris?.small||'',price=c.prices?.usd?'$'+c.prices.usd:'Price unavailable';return `<button class="choice" data-i="${i}">${img?`<img src="${img}" alt="">`:''}<span class="meta"><b>${esc(c.set_name||'Unknown set')}</b><br><span class="small">${esc(c.set?.toUpperCase()||'')} • #${esc(c.collector_number||'?')}</span><br><span class="price">${price}</span></span></button>`}).join('')}</div>`;
 resultEl.querySelectorAll('.choice').forEach(b=>b.onclick=()=>showCard(matches[Number(b.dataset.i)]));resultCard.scrollIntoView({behavior:'smooth'})
}
function showCard(c){
 resultCard.classList.remove('hidden');let img=c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||'',price=c.prices?.usd?'$'+c.prices.usd:'Price unavailable';
 resultEl.innerHTML=`<div class="result">${img?`<img src="${img}" alt="">`:''}<div><div class="name">${esc(c.name)}</div><div class="small">${esc(c.set_name||'')} • #${esc(c.collector_number||'?')}</div><div class="price">${price}</div></div></div><button id="add" class="full">➕ Add to Collection</button>`;
 document.getElementById('add').onclick=()=>{let arr=cards();arr.unshift({name:c.name,set:c.set_name,setCode:c.set,id:c.id,collector:c.collector_number,price:c.prices?.usd||null});saveCards(arr);renderCollection();document.getElementById('add').textContent='✓ Added to Collection';document.getElementById('add').disabled=true};
 resultCard.scrollIntoView({behavior:'smooth'})
}

/* ----- Deck builder ----- */
function collectionGroups(){
 const map={};
 for(const c of cards()){
  const k=c.id||c.name;
  if(!map[k])map[k]={...c,owned:0};
  map[k].owned++;
 }
 return Object.values(map);
}
async function cardData(c){
 if(c._data)return c._data;
 try{
  const r=await fetch('https://api.scryfall.com/cards/'+encodeURIComponent(c.id));
  if(r.ok){c._data=await r.json();return c._data}
 }catch(e){}
 return c;
}
function scoreCard(c,style,wanted){
 const d=c._data||c,type=(d.type_line||'').toLowerCase(),text=(d.oracle_text||'').toLowerCase();
 let s=Math.random()*2,colors=d.color_identity||[];
 if(wanted!=='any'){
  const w=wanted.split('');
  if(colors.some(x=>w.includes(x)))s+=25;
  if(colors.some(x=>!w.includes(x)))s-=18;
 }
 if(type.includes('land'))s-=5;
 if(style==='aggro')s+=(type.includes('creature')?20:0)+(text.includes('haste')?12:0)+(text.includes('attack')?8:0)-(Number(d.cmc||0)*2);
 if(style==='control')s+=(!type.includes('creature')?8:0)+(/(counter|destroy|exile|draw|return)/.test(text)?16:0);
 if(style==='creatures')s+=type.includes('creature')?25:0;
 if(style==='balanced')s+=type.includes('creature')?10:0;
 if(style==='surprise')s+=Math.random()*15;
 return s;
}
async function buildDeck(){
 const status=document.getElementById('buildStatus'),btn=document.getElementById('buildDeck');
 const pool=collectionGroups(),style=document.getElementById('strategy').value,wanted=document.getElementById('colors').value;
 if(!pool.length){status.classList.remove('hidden');status.textContent='📷 Scan some cards into your collection first.';return}
 btn.disabled=true;status.classList.remove('hidden');status.textContent='🔎 Looking at your collection…';
 try{
  for(const c of pool)await cardData(c);
  const lands=pool.filter(c=>(c._data?.type_line||'').toLowerCase().includes('land'));
  const spells=pool.filter(c=>!(c._data?.type_line||'').toLowerCase().includes('land')).sort((a,b)=>scoreCard(b,style,wanted)-scoreCard(a,style,wanted));
  const deck=[],maxLand=Math.min(24,lands.reduce((s,c)=>s+c.owned,0));
  let landSlots=maxLand,spellSlots=60-landSlots;
  for(const c of spells){
   if(spellSlots<=0)break;
   const n=Math.min(4,c.owned,spellSlots);
   if(n>0){deck.push({...c,qty:n});spellSlots-=n}
  }
  for(const c of lands){
   if(landSlots<=0)break;
   const n=Math.min(c.owned,landSlots);
   if(n>0){deck.push({...c,qty:n});landSlots-=n}
  }
  const total=deck.reduce((s,c)=>s+c.qty,0),missing=60-total;
  const name=document.getElementById('deckName').value.trim()||'My Auto-Built Deck';
  const ds=getDecks();ds.unshift({name,cards:deck,style,wanted,missing,created:Date.now()});saveDecks(ds);
  renderDecks();openDeck(0);
  status.textContent=missing?`✅ Built ${total} cards from your collection. You need ${missing} more cards to reach 60.`:'✅ Built a 60-card deck from your collection!';
 }catch(e){status.textContent='Something went wrong while building the deck. Try again.'}
 finally{btn.disabled=false}
}
function renderDecks(){
 const ds=getDecks(),el=document.getElementById('deckList');
 el.innerHTML=ds.length?'<h3>Saved Decks</h3>'+ds.map((d,i)=>`<div class="deck-row"><div><b>${esc(d.name)}</b><div class="small">${d.cards.reduce((s,c)=>s+c.qty,0)} cards</div></div><button class="secondary" data-open="${i}">Open</button></div>`).join(''):'<p class="muted">No saved decks yet.</p>';
 el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDeck(Number(b.dataset.open)))
}
function openDeck(i){
 const ds=getDecks(),d=ds[i],el=document.getElementById('deckEditor');if(!d)return;
 const total=d.cards.reduce((s,c)=>s+c.qty,0);
 el.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin:0">${esc(d.name)}</h3><div class="small">${total}/60 cards</div></div><button class="secondary" id="deleteDeck">Delete</button></div><div class="status">${d.missing?'Needs '+d.missing+' more cards.':'Ready at 60 cards.'}</div>${d.cards.map(c=>`<div class="deck-row"><div><b>${esc(c.name)}</b><div class="small">${esc(c.set||'')} • Qty ${c.qty}</div></div><span class="price">$${esc(c.price||'0')}</span></div>`).join('')}</div>`;
 document.getElementById('deleteDeck').onclick=()=>{ds.splice(i,1);saveDecks(ds);el.innerHTML='';renderDecks()}
}

startBtn.onclick=startCamera;captureBtn.onclick=capture;
document.getElementById('again').onclick=()=>{resultCard.classList.add('hidden');setStatus('Ready for another scan.');window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('scanTab').onclick=()=>{scanner.classList.remove('hidden');collection.classList.add('hidden');decks.classList.add('hidden')};
document.getElementById('collectionTab').onclick=()=>{collection.classList.remove('hidden');scanner.classList.add('hidden');decks.classList.add('hidden');renderCollection()};
document.getElementById('decksTab').onclick=()=>{decks.classList.remove('hidden');scanner.classList.add('hidden');collection.classList.add('hidden');renderDecks()};
document.getElementById('buildDeck').onclick=buildDeck;
renderCollection();renderDecks();
</script>
</body>
</html>
